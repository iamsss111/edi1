<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Faculty</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/css/styles.css"></head>
<body class="p-4"><main class="container" style="max-width:800px"><a href="/admin/faculty/list.html">← Faculty</a><h1 class="my-4">Create faculty account</h1>
<form id="adminFacultyForm" class="row g-3">
<div class="col-md-6"><label class="form-label">First name</label><input class="form-control" name="first_name" required></div><div class="col-md-6"><label class="form-label">Last name</label><input class="form-control" name="last_name" required></div>
<div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required></div><div class="col-md-6"><label class="form-label">Initial password</label><input type="password" class="form-control" name="password" minlength="8" required></div>
<div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone"></div><div class="col-md-6"><label class="form-label">Employee number</label><input class="form-control" name="employee_number" required></div>
<div class="col-md-6"><label class="form-label">Designation</label><input class="form-control" name="designation" required></div><div class="col-md-6"><label class="form-label">Department ID</label><input type="number" min="1" class="form-control" name="department_id" required></div>
<div class="col-12"><hr><h2 class="h5">Subject assignment <span class="text-muted fw-normal">(optional)</span></h2><p class="small text-muted">Choose a subject in this faculty member’s department. Students in the selected semester will be able to enroll.</p></div>
<div class="col-md-6"><label class="form-label" for="facultySubjectId">Subject</label><select class="form-select" name="subject_id" id="facultySubjectId"><option value="">No subject assignment</option></select></div>
<div class="col-md-3"><label class="form-label">Semester</label><input type="number" min="1" max="12" class="form-control" name="subject_semester" id="facultySubjectSemester" disabled></div>
<div class="col-md-3"><label class="form-label">Academic year</label><input type="number" min="1" class="form-control" name="subject_year" id="facultySubjectYear" disabled></div>
<div class="col-12"><button class="btn btn-primary" type="submit">Create faculty</button></div></form></main>
<script src="/static/js/api.js"></script><script src="/static/js/app.js"></script><script src="/static/js/portal_ui.js"></script></body></html>
