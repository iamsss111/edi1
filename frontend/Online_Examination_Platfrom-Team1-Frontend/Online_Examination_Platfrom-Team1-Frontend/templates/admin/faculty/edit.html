<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Faculty - MMCOE Exam</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/css/styles.css"></head>
<body><div class="app-wrapper"><div class="main-content w-100"><main class="content-body"><a href="/admin/faculty/list.html" class="text-decoration-none">&larr; Faculty</a><div class="glass-card p-4 mt-3"><h3 id="form-title" class="fw-bold">Edit Faculty</h3><div id="form-error" class="alert alert-danger d-none"></div><form id="faculty-form" class="row g-3"><div class="col-md-6"><label class="form-label">First name</label><input name="first_name" class="form-control" required></div><div class="col-md-6"><label class="form-label">Last name</label><input name="last_name" class="form-control" required></div><div class="col-md-6"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required></div><div class="col-md-6"><label class="form-label">Phone</label><input name="phone" class="form-control"></div><div class="col-md-4"><label class="form-label">Department ID</label><input name="department_id" type="number" class="form-control" required></div><div class="col-md-4"><label class="form-label">Employee number</label><input name="employee_number" class="form-control" required></div><div class="col-md-4"><label class="form-label">Designation</label><input name="designation" class="form-control" required></div><div class="col-12"><button class="btn btn-primary-custom" type="submit">Save Faculty</button></div></form></div><div class="glass-card p-4 mt-4"><h5 class="fw-bold">Subject Assignments</h5><form id="assignment-form" class="row g-2"><div class="col-md-4"><label class="form-label">Subject ID</label><input name="subject_id" type="number" class="form-control" required></div><div class="col-md-3"><label class="form-label">Semester</label><input name="semester" type="number" class="form-control" required></div><div class="col-md-3"><label class="form-label">Year</label><input name="year" type="number" class="form-control" required></div><div class="col-md-2 d-flex align-items-end"><button class="btn btn-outline-info w-100" type="submit">Assign</button></div></form><div id="assignment-error" class="text-danger small mt-2"></div><div id="assignment-list" class="small mt-3">Loading assignments...</div></div></main></div></div><script src="/static/js/api.js"></script><script src="/static/js/app.js"></script><script src="/static/js/admin_profile_forms.js"></script></body></html>
