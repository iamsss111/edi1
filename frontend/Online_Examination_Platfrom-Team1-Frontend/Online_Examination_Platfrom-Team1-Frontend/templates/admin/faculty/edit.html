<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Faculty</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="p-4">
<main class="container" style="max-width:900px">
  <a href="/admin/faculty/list.html">← Faculty</a>
  <h1 class="my-4">Edit faculty account</h1>
  <form id="adminFacultyForm" class="row g-3">
    <div class="col-md-6"><label class="form-label">First name</label><input class="form-control" name="first_name" required></div>
    <div class="col-md-6"><label class="form-label">Last name</label><input class="form-control" name="last_name" required></div>
    <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required></div>
    <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone"></div>
    <div class="col-md-6"><label class="form-label">Employee number</label><input class="form-control" name="employee_number" required></div>
    <div class="col-md-6"><label class="form-label">Designation</label><input class="form-control" name="designation" required></div>
    <div class="col-md-6"><label class="form-label">Department ID</label><input type="number" min="1" class="form-control" name="department_id" required></div>
    <div class="col-12"><button class="btn btn-primary" type="submit">Save changes</button></div>
  </form>

  <section id="facultySubjectAssignments" class="glass-card p-4 mt-4">
    <h2 class="h5 fw-bold">Subject assignments</h2>
    <p class="text-muted small">Assign an active subject from this faculty member’s department. The assignment controls which subjects they can use to create exams.</p>
    <form id="facultySubjectAssignmentForm" class="row g-3 align-items-end">
      <div class="col-md-6"><label class="form-label" for="assignmentSubjectId">Subject</label><select class="form-select" id="assignmentSubjectId" name="subject_id" required><option value="">Loading subjects…</option></select></div>
      <div class="col-md-2"><label class="form-label" for="assignmentSemester">Semester</label><input class="form-control" id="assignmentSemester" name="semester" type="number" min="1" max="12" required></div>
      <div class="col-md-2"><label class="form-label" for="assignmentYear">Academic year</label><input class="form-control" id="assignmentYear" name="year" type="number" min="1" required></div>
      <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Assign</button></div>
    </form>
    <div class="table-responsive mt-4"><table class="table table-sm align-middle"><thead><tr><th>Subject</th><th>Semester</th><th>Academic year</th><th>Status</th><th></th></tr></thead><tbody id="facultyAssignmentsBody"><tr><td colspan="5" class="text-muted">Loading assignments…</td></tr></tbody></table></div>
  </section>
</main>
<script src="/static/js/api.js"></script><script src="/static/js/app.js"></script><script src="/static/js/portal_ui.js"></script>
</body>
</html>
