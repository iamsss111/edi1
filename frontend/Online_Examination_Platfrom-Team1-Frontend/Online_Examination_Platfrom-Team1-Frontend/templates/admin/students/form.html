<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student Record</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/css/styles.css"></head><body class="p-4"><main class="container" style="max-width:800px"><a href="/admin/students/list.html">← Students</a><h1 class="my-4" id="studentFormTitle">Create student</h1><form id="adminStudentForm" class="row g-3"><div class="col-md-6"><label class="form-label">First name</label><input class="form-control" name="first_name" required></div><div class="col-md-6"><label class="form-label">Last name</label><input class="form-control" name="last_name" required></div><div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required></div><div class="col-md-6" id="studentPasswordField"><label class="form-label">Initial password</label><input type="password" class="form-control" name="password" minlength="8" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone"></div><div class="col-md-6"><label class="form-label">Department ID</label><input type="number" min="1" class="form-control" name="department_id" required></div><div class="col-md-6"><label class="form-label">Roll number</label><input class="form-control" name="roll_number" required></div><div class="col-md-6"><label class="form-label">Enrollment number</label><input class="form-control" name="enrollment_number"></div><div class="col-md-6"><label class="form-label">Year</label><input type="number" min="1" class="form-control" name="year"></div><div class="col-md-6"><label class="form-label">Semester</label><input type="number" min="1" class="form-control" name="semester"></div><div class="col-12"><button class="btn btn-primary" type="submit">Save student</button></div></form></main><script src="/static/js/api.js"></script><script src="/static/js/app.js"></script><script src="/static/js/portal_ui.js"></script></body></html>
