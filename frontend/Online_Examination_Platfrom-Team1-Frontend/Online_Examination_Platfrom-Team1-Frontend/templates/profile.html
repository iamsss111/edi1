<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - MMCOE Examination Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="container py-4 py-md-5" style="max-width: 980px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <a id="profileBackLink" href="/" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-2"></i>Back to portal</a>
      <span id="profileRoleBadge" class="badge bg-primary">Account</span>
    </div>
    <div id="profileLoading" class="glass-card p-5 text-center" role="status">
      <div class="spinner-border text-primary" aria-hidden="true"></div>
      <p class="text-muted mt-3 mb-0">Loading your profile…</p>
    </div>
    <div id="profileError" class="alert alert-danger d-none" role="alert"></div>
    <section id="profileContent" class="glass-card p-4 p-md-5 d-none">
      <div class="d-flex align-items-center gap-3 border-bottom pb-4 mb-4">
        <div id="profileAvatar" class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold" style="width:72px;height:72px;font-size:1.7rem;">?</div>
        <div>
          <h1 id="profileName" class="h3 fw-bold mb-1">My Profile</h1>
          <div id="profileRole" class="text-muted">Account</div>
        </div>
      </div>
      <h2 class="h5 fw-bold mb-3">Account details</h2>
      <div id="profileDetails" class="row g-3"></div>
      <div id="roleProfileSection" class="d-none mt-4">
        <h2 id="roleProfileTitle" class="h5 fw-bold mb-3">Profile details</h2>
        <div id="profileCompletionNotice" class="alert alert-warning d-none" role="status"></div>
        <div id="roleProfileDetails" class="row g-3"></div>
      </div>
    </section>
  </div>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/profile_ui.js"></script>
</body>
</html>
