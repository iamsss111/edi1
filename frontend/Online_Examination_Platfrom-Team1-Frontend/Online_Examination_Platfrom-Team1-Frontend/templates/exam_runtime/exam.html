<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Exam - DBMS Mid-Term Assessment</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="/static/css/styles.css">

</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Exam Top Header -->

  <header class="exam-header">

    <div class="d-flex align-items-center gap-3">

      <span class="fw-bold fs-5 text-dark" id="examTitle">
        DBMS Mid-Term Assessment
      </span>

      <span class="badge bg-secondary" id="examSubject">
        CS101
      </span>

    </div>

    <div class="d-flex align-items-center gap-4">

      <div class="timer-box" id="timerBox">

        <i class="bi bi-clock-history"></i>

        <span id="examTimer">60:00</span>

      </div>

      <a
        href="/exam_runtime/review.html"
        class="btn btn-primary-custom"
      >
        Finish & Review
        <i class="bi bi-check2-circle"></i>
      </a>

    </div>

  </header>

  <!-- Live Exam Main Body -->

  <div class="container-fluid flex-grow-1 p-4">

    <div class="row g-4">

      <!-- Left: Question Panel -->

      <div class="col-lg-8">

        <div id="questionsContainer"></div>

      </div>

      <!-- Right: Navigation Palette & Status -->

      <div class="col-lg-4">

        <div class="glass-card p-4 mb-3">

          <h6 class="fw-bold mb-3 text-dark">
            Question Navigation Palette
          </h6>

          <div
            class="d-flex gap-2 flex-wrap mb-4"
            id="questionPalette"
          ></div>

          <div class="small text-muted d-flex flex-column gap-2 border-top pt-3">

            <div class="d-flex align-items-center gap-2">

              <span
                class="question-palette-btn answered"
                style="width:24px; height:24px; font-size: 10px;"
              >
                ✓
              </span>

              Answered

            </div>

            <div class="d-flex align-items-center gap-2">

              <span
                class="question-palette-btn review"
                style="width:24px; height:24px; font-size: 10px;"
              >
                ★
              </span>

              Marked for Review

            </div>

            <div class="d-flex align-items-center gap-2">

              <span
                class="question-palette-btn current"
                style="width:24px; height:24px; font-size: 10px;"
              >
                •
              </span>

              Current Question

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

  <script src="/static/js/api.js"></script>

  <script src="/static/js/exam_timer.js"></script>

  <script src="/static/js/exam_engine.js"></script>

  <script src="/static/js/integrity.js"></script>

</body>

</html>
