<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-Submission Review - MMCOE Exam Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <div class="container py-5" style="max-width: 800px;">
    <div class="glass-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-light p-3 rounded-circle border mb-3">
          <i class="bi bi-file-earmark-check-fill text-warning fs-2"></i>
        </div>
        <h3 class="fw-bold mb-1 text-dark">Pre-Submission Attempt Review</h3>
        <p class="text-muted small m-0">EXAM-DBMS-MID &bull; DBMS Mid-Term Assessment</p>
      </div>

      <div class="row g-3 text-center mb-4">
        <div class="col-4">
          <div class="p-3 rounded border section-bg">
            <span class="text-muted small">Total Questions</span>
            <h4
  class="fw-bold text-dark m-0"
  id="totalQuestions"
>
  0
</h4>
          </div>
        </div>
        <div class="col-4">
          <div class="p-3 rounded border section-bg">
            <span class="text-muted small">Answered</span>
            <h4
  class="fw-bold text-emerald m-0"
  id="answeredCount"
>
  0
</h4>
          </div>
        </div>
        <div class="col-4">
          <div class="p-3 rounded border section-bg">
            <span class="text-muted small">Unanswered</span>
            <h4
  class="fw-bold text-muted m-0"
  id="unansweredCount"
>
  0
</h4>
          </div>
        </div>
      </div>

      <div class="table-responsive mb-4">
        <table class="table table-hover align-middle small">
          <thead>
            <tr class="text-muted">
              <th>Q#</th>
              <th>Question Type</th>
              <th>Status</th>
              <th>Review Flag</th>
            </tr>
          </thead>
        <tbody id="reviewTableBody">
</tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between">
        <a href="/exam_runtime/exam.html" class="btn btn-outline-secondary">
          &larr; Return to Question Palette
        </a>
        <button
  type="button"
  id="submitExamButton"
  class="btn btn-success px-4 fw-bold"
>
  <i class="bi bi-send-fill me-1"></i>
  Finalize & Submit Exam Attempt
</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/api.js"></script>


<script>
  let reviewState = {
    attemptId: null,
    examId: null,
    questions: [],
    answers: {},
    isSubmitted: false
  };


  document.addEventListener('DOMContentLoaded', async () => {

    try {

      const storedAttempt =
        sessionStorage.getItem('exam_runtime_start');

      if (!storedAttempt) {
        throw new Error(
          'No active examination attempt was found.'
        );
      }

      const attempt =
        JSON.parse(storedAttempt);

      reviewState.attemptId =
        attempt.attempt_id;

      reviewState.examId =
        attempt.exam_id;


      const [questionsResponse, answersResponse] =
        await Promise.all([

          apiRequest(
            `/exams/${reviewState.examId}/questions`,
            {
              method: 'GET'
            }
          ),

          apiRequest(
            `/attempts/${reviewState.attemptId}/answers`,
            {
              method: 'GET'
            }
          )

        ]);


      if (
        !questionsResponse ||
        !questionsResponse.success ||
        !questionsResponse.data ||
        !Array.isArray(
          questionsResponse.data.questions
        )
      ) {
        throw new Error(
          'Unable to retrieve examination questions.'
        );
      }


      if (
        !answersResponse ||
        !answersResponse.success ||
        !answersResponse.data ||
        !Array.isArray(
          answersResponse.data.answers
        )
      ) {
        throw new Error(
          'Unable to retrieve saved examination answers.'
        );
      }


      reviewState.questions =
        questionsResponse.data.questions;


      answersResponse.data.answers.forEach(answer => {

        reviewState.answers[
          answer.exam_question_id
        ] = answer.selected_option_id;

      });


      renderReview();

    } catch (error) {

      console.error(
        'Failed to load examination review:',
        error
      );

      alert(
        error.message ||
        'Unable to load the examination review.'
      );

    }

  });


  function renderReview() {

    const totalQuestions =
      reviewState.questions.length;


    const answeredCount =
      reviewState.questions.filter(question => {

        const selectedOption =
          reviewState.answers[
            question.exam_question_id
          ];

        return (
          selectedOption !== null &&
          selectedOption !== undefined
        );

      }).length;


    const unansweredCount =
      totalQuestions - answeredCount;


    document.getElementById(
      'totalQuestions'
    ).textContent = totalQuestions;


    document.getElementById(
      'answeredCount'
    ).textContent = answeredCount;


    document.getElementById(
      'unansweredCount'
    ).textContent = unansweredCount;


    const tableBody =
      document.getElementById(
        'reviewTableBody'
      );


    tableBody.innerHTML = '';


    reviewState.questions.forEach(
      (question, index) => {

        const questionNumber =
          question.number || index + 1;


        const answered =
          reviewState.answers[
            question.exam_question_id
          ] !== null &&
          reviewState.answers[
            question.exam_question_id
          ] !== undefined;


        const row =
          document.createElement('tr');


        row.innerHTML = `
          <td>Q${questionNumber}</td>

          <td>
            ${getQuestionTypeLabel(question.type)}
          </td>

          <td>
            ${
              answered
                ? '<span class="badge bg-success">ANSWERED</span>'
                : '<span class="badge bg-secondary">UNANSWERED</span>'
            }
          </td>

          <td>
            <span class="text-muted">No</span>
          </td>
        `;


        tableBody.appendChild(row);

      }
    );

  }


  function getQuestionTypeLabel(type) {

    if (!type) {
      return 'Question';
    }

    if (type === 'MCQ') {
      return 'MCQ (Single Choice)';
    }

    if (type === 'MSQ') {
      return 'MSQ (Multiple Choice)';
    }

    return type;
  }


  async function finalizeExam() {

    if (reviewState.isSubmitted) {
      return;
    }


    if (!reviewState.attemptId) {

      alert(
        'No active examination attempt was found.'
      );

      return;
    }


    const submitButton =
      document.getElementById(
        'submitExamButton'
      );


    const confirmed =
      confirm(
        'Are you sure you want to submit your examination? You will not be able to change your answers afterward.'
      );


    if (!confirmed) {
      return;
    }


    try {

      submitButton.disabled = true;

      submitButton.innerHTML =
        '<span class="spinner-border spinner-border-sm me-2"></span>Submitting...';


      const response =
        await apiRequest(
          `/attempts/${reviewState.attemptId}/submit`,
          {
            method: 'POST'
          }
        );


      if (
        !response ||
        !response.success ||
        !response.data
      ) {
        throw new Error(
          response?.message ||
          'The server returned an invalid submission response.'
        );
      }


      reviewState.isSubmitted = true;


      sessionStorage.setItem(
        'exam_submission_response',
        JSON.stringify(response.data)
      );


      window.location.href =
        '/exam_runtime/submitted.html';


    } catch (error) {

      console.error(
        'Exam submission failed:',
        error
      );


      reviewState.isSubmitted = false;


      submitButton.disabled = false;


      submitButton.innerHTML =
        '<i class="bi bi-send-fill me-1"></i> Finalize & Submit Exam Attempt';


      alert(
        error.message ||
        'Unable to submit the examination. Please try again.'
      );

    }

  }


  document
    .getElementById('submitExamButton')
    .addEventListener(
      'click',
      finalizeExam
    );

</script>
</body>
</html>
