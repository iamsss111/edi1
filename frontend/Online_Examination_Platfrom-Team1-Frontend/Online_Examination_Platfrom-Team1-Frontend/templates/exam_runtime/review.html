<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-Submission Review - MMCOE Exam Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <div class="container py-5" style="max-width: 800px;">
    <div class="glass-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-light p-3 rounded-circle border mb-3">
          <i class="bi bi-file-earmark-check-fill text-warning fs-2"></i>
        </div>
        <h3 class="fw-bold mb-1 text-dark">Pre-Submission Attempt Review</h3>
        <p class="text-muted small m-0">EXAM-DBMS-MID &bull; DBMS Mid-Term Assessment</p>
      </div>

      <div class="row g-3 text-center mb-4">
        <div class="col-4">
          <div class="p-3 rounded border section-bg">
            <span class="text-muted small">Total Questions</span>
            <h4 class="fw-bold text-dark m-0">2</h4>
          </div>
        </div>
        <div class="col-4">
          <div class="p-3 rounded border section-bg">
            <span class="text-muted small">Answered</span>
            <h4 class="fw-bold text-emerald m-0">2</h4>
          </div>
        </div>
        <div class="col-4">
          <div class="p-3 rounded border section-bg">
            <span class="text-muted small">Unanswered</span>
            <h4 class="fw-bold text-muted m-0">0</h4>
          </div>
        </div>
      </div>

      <div class="table-responsive mb-4">
        <table class="table table-hover align-middle small">
          <thead>
            <tr class="text-muted">
              <th>Q#</th>
              <th>Question Type</th>
              <th>Status</th>
              <th>Review Flag</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Q1</td>
              <td>MCQ (Single Choice)</td>
              <td><span class="badge bg-success">ANSWERED</span></td>
              <td><span class="text-muted">No</span></td>
            </tr>
            <tr>
              <td>Q2</td>
              <td>MSQ (Multiple Choice)</td>
              <td><span class="badge bg-success">ANSWERED</span></td>
              <td><span class="text-muted">No</span></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between">
        <a href="/exam_runtime/exam.html" class="btn btn-outline-secondary">
          &larr; Return to Question Palette
        </a>
        <a href="/exam_runtime/submitted.html" class="btn btn-success px-4 fw-bold">
          <i class="bi bi-send-fill me-1"></i> Finalize & Submit Exam Attempt
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
