  /api/v1/admin/attempts/{attempt_id}:
    get:
      tags: [Admin]
      summary: Retrieve an attempt
      x-required-role: ADMIN
      parameters: [{ $ref: '#/components/parameters/AttemptId' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/attempts/{attempt_id}/integrity-events:
    get:
      tags: [Admin]
      summary: Retrieve attempt integrity events
      x-required-role: ADMIN
      parameters: [{ $ref: '#/components/parameters/AttemptId' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/results:
    get:
      tags: [Admin]
      summary: Retrieve results
      x-required-role: ADMIN
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/exams/{exam_id}/results:
    get:
      tags: [Admin]
      summary: Retrieve results for an exam
      x-required-role: ADMIN
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/results/{result_id}:
    get:
      tags: [Admin]
      summary: Retrieve a result
      x-required-role: ADMIN
      parameters: [{ name: result_id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/dashboard/statistics:
    get:
      tags: [Admin]
