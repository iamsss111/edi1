  /api/v1/admin/audit-logs/{audit_id}:
    get:
      tags: [Admin]
      summary: Retrieve an audit log
      x-required-role: ADMIN
      parameters: [{ name: audit_id, in: path, required: true, schema: { type: integer, format: int64 } }]
