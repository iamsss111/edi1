  /api/v1/admin/questions:
    get:
      tags: [Admin]
      summary: Retrieve questions
      x-required-role: ADMIN
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/questions/{question_id}:
    get:
      tags: [Admin]
      summary: Retrieve a question
      x-required-role: ADMIN
      parameters: [{ $ref: '#/components/parameters/QuestionId' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/questions/{question_id}/status:
    patch:
      tags: [Admin]
      summary: Change question status
      x-required-role: ADMIN
      parameters: [{ $ref: '#/components/parameters/QuestionId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/registrations:
