openapi: 3.0.3
info:
  title: Online Examination Platform API
  version: 1.0.0
  description: Documentation for the existing Online Examination Platform API.
servers:
  - url: http://127.0.0.1:5000
tags:
  - name: Health
  - name: Authentication
  - name: Student
  - name: Faculty
  - name: Admin
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Check API availability
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/db-health:
    get:
      tags: [Health]
      summary: Check database connectivity
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a student account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/auth/departments:
    get:
      tags: [Authentication]
      summary: List active departments for student signup
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/LoginSuccess' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Get the authenticated user identity
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/student-test:
    get:
      tags: [Authentication]
      summary: Verify student role access
      x-required-role: STUDENT
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/exams/{exam_id}/start:
    post:
      tags: [Student]
      summary: Start an examination
      x-required-role: STUDENT
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/exams/{exam_id}/questions:
    get:
      tags: [Student]
      summary: Retrieve questions for an examination
      x-required-role: STUDENT
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
    post:
      tags: [Faculty]
      summary: Add a question to an exam
      x-required-role: FACULTY
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, additionalProperties: true } }
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/attempts/{attempt_id}/next-question:
    get:
      tags: [Student]
      summary: Retrieve the next adaptive question
      x-required-role: STUDENT
      parameters: [{ $ref: '#/components/parameters/AttemptId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' }, '500': { $ref: '#/components/responses/Error' } }
  /api/v1/attempts/{attempt_id}/answers:
    post:
      tags: [Student]
      summary: Submit an answer
      x-required-role: STUDENT
      parameters: [{ $ref: '#/components/parameters/AttemptId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerRequest' }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' } }
    get:
      tags: [Student]
      summary: Retrieve submitted answers
      x-required-role: STUDENT
      parameters: [{ $ref: '#/components/parameters/AttemptId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' } }
  /api/v1/attempts/{attempt_id}/submit:
    post:
      tags: [Student]
      summary: Submit an examination attempt
      x-required-role: STUDENT
      parameters: [{ $ref: '#/components/parameters/AttemptId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' } }
  /api/v1/attempts/{attempt_id}/evaluate:
    post:
      tags: [Student]
      summary: Evaluate an examination attempt
      x-required-role: STUDENT
      parameters: [{ $ref: '#/components/parameters/AttemptId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' } }
  /api/v1/attempts/{attempt_id}/result:
    post:
      tags: [Student]
      summary: Create an attempt result
      x-required-role: STUDENT
      parameters: [{ $ref: '#/components/parameters/AttemptId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' } }
    get:
      tags: [Student]
      summary: Retrieve an attempt result
      x-required-role: STUDENT
      parameters: [{ $ref: '#/components/parameters/AttemptId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/attempts/{attempt_id}/integrity-events:
    post:
      tags: [Student]
      summary: Record an integrity event
      x-required-role: STUDENT
      parameters: [{ $ref: '#/components/parameters/AttemptId' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, additionalProperties: true } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' } }
  /api/v1/subjects:
    get:
      tags: [Faculty]
      summary: Retrieve faculty subjects
      x-required-role: FACULTY
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/questions:
    get:
      tags: [Faculty]
      summary: Retrieve faculty questions
      x-required-role: FACULTY
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
    post:
      tags: [Faculty]
      summary: Create a question
      x-required-role: FACULTY
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, additionalProperties: true } }
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/questions/{question_id}:
    get:
      tags: [Faculty]
      summary: Retrieve a faculty-owned question for editing
      x-required-role: FACULTY
      parameters: [{ $ref: '#/components/parameters/QuestionId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
    put:
      tags: [Faculty]
      summary: Update a faculty-owned question
      x-required-role: FACULTY
      parameters: [{ $ref: '#/components/parameters/QuestionId' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, additionalProperties: true } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/questions/{question_id}/options:
    post:
      tags: [Faculty]
      summary: Add an option to a question
      x-required-role: FACULTY
      parameters: [{ $ref: '#/components/parameters/QuestionId' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, additionalProperties: true } }
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/exams:
    get:
      tags: [Faculty]
      summary: Retrieve faculty exams
      x-required-role: FACULTY
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
    post:
      tags: [Faculty]
      summary: Create an exam
      x-required-role: FACULTY
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ExamRequest' } }
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/exams/{exam_id}:
    get:
      tags: [Faculty]
      summary: Retrieve exam details
      x-required-role: FACULTY
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
    put:
      tags: [Faculty]
      summary: Update an unregistered draft exam
      x-required-role: FACULTY
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, additionalProperties: true } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /api/v1/exams/{exam_id}/schedule:
    get:
      tags: [Faculty]
      summary: Retrieve an exam schedule
      x-required-role: FACULTY
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
    post:
      tags: [Faculty]
      summary: Schedule an exam
      x-required-role: FACULTY
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, additionalProperties: true } }
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/exams/{exam_id}/publish:
    post:
      tags: [Faculty]
      summary: Publish an exam
      x-required-role: FACULTY
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/exams/{exam_id}/results:
    get:
      tags: [Faculty]
      summary: Retrieve results for a faculty exam
      x-required-role: FACULTY
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/student/exams/available:
    get:
      tags: [Student]
      summary: List upcoming published exams available to the student
      x-required-role: STUDENT
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/student/exams/{exam_id}/register:
    post:
      tags: [Student]
      summary: Register the authenticated student for an exam
      x-required-role: STUDENT
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/student/registrations:
    get:
      tags: [Student]
      summary: List the authenticated student's registrations
      x-required-role: STUDENT
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' } }
  /api/v1/student/registrations/{registration_id}:
    get:
      tags: [Student]
      summary: Get a registration owned by the authenticated student
      x-required-role: STUDENT
      parameters:
        - name: registration_id
          in: path
          required: true
          schema: { type: integer }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/student/results:
    get:
      tags: [Student]
      summary: List published results belonging to the student
      x-required-role: STUDENT
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' } }
  /api/v1/student/results/{result_id}:
    get:
      tags: [Student]
      summary: Get a published result and question breakdown
      x-required-role: STUDENT
      parameters:
        - name: result_id
          in: path
          required: true
          schema: { type: integer }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/faculty/exams/{exam_id}/registrations:
    get:
      tags: [Faculty]
      summary: List candidates registered for an owned exam
      x-required-role: FACULTY
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/faculty/exams/{exam_id}/attempts:
    get:
      tags: [Faculty]
      summary: List attempts for an owned exam
      x-required-role: FACULTY
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/faculty/attempts/{attempt_id}:
    get:
      tags: [Faculty]
      summary: Get an attempt and its question-wise answers
      x-required-role: FACULTY
      parameters: [{ $ref: '#/components/parameters/AttemptId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/faculty/attempts/{attempt_id}/evaluate:
    post:
      tags: [Faculty]
      summary: Automatically score objective answers and create a pending result
      x-required-role: FACULTY
      parameters: [{ $ref: '#/components/parameters/AttemptId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/faculty/attempts/{attempt_id}/integrity-events:
    get:
      tags: [Faculty]
      summary: Get integrity events for an attempt on an owned exam
      x-required-role: FACULTY
      parameters: [{ $ref: '#/components/parameters/AttemptId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/faculty/evaluations/pending:
    get:
      tags: [Faculty]
      summary: List submitted attempts without an evaluation score
      x-required-role: FACULTY
      parameters:
        - name: exam_id
          in: query
          required: false
          schema: { type: integer }
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' } }
  /api/v1/faculty/exams/{exam_id}/results:
    get:
      tags: [Faculty]
      summary: List results for an owned exam, including publication state
      x-required-role: FACULTY
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/faculty/results/{result_id}/publish:
    post:
      tags: [Faculty]
      summary: Publish one result for an owned exam
      x-required-role: FACULTY
      parameters:
        - name: result_id
          in: path
          required: true
          schema: { type: integer }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/faculty/exams/{exam_id}/results/publish:
    post:
      tags: [Faculty]
      summary: Publish all unpublished results for an owned exam
      x-required-role: FACULTY
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/faculty/dashboard/statistics:
    get:
      tags: [Faculty]
      summary: Get faculty dashboard statistics
      x-required-role: FACULTY
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' } }
  /api/v1/faculty/exams/{exam_id}/analytics:
    get:
      tags: [Faculty]
      summary: Get registration, outcome, score, and question analytics for an owned exam
      x-required-role: FACULTY
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/faculty/students/{student_id}/performance:
    get:
      tags: [Faculty]
      summary: Get a student's published results for exams owned by this faculty member
      x-required-role: FACULTY
      parameters:
        - name: student_id
          in: path
          required: true
          schema: { type: integer }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/notifications:
    get:
      tags: [Student, Faculty, Admin]
      summary: List notifications for the authenticated user
      parameters:
        - name: unread
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' } }
  /api/v1/notifications/unread-count:
    get:
      tags: [Student, Faculty, Admin]
      summary: Count unread notifications for the authenticated user
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' } }
  /api/v1/notifications/{notification_id}/read:
    patch:
      tags: [Student, Faculty, Admin]
      summary: Mark one owned notification as read
      parameters:
        - name: notification_id
          in: path
          required: true
          schema: { type: integer }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/notifications/read-all:
    patch:
      tags: [Student, Faculty, Admin]
      summary: Mark all notifications belonging to the current user as read
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' } }
  /api/v1/admin/exams:
    get:
      tags: [Admin]
      summary: Retrieve all exams
      x-required-role: ADMIN
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/admin/exams/{exam_id}:
    get:
      tags: [Admin]
      summary: Retrieve an exam
      x-required-role: ADMIN
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/admin/subjects:
    get:
      tags: [Admin]
      summary: Retrieve all subjects
      x-required-role: ADMIN
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Admin]
      summary: Create a subject
      x-required-role: ADMIN
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' } }
  /api/v1/admin/subjects/{subject_id}:
    put:
      tags: [Admin]
      summary: Update a subject
      x-required-role: ADMIN
      parameters: [{ $ref: '#/components/parameters/SubjectId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' } }
  /api/v1/admin/subjects/{subject_id}/status:
    patch:
      tags: [Admin]
      summary: Change subject status
      x-required-role: ADMIN
      parameters: [{ $ref: '#/components/parameters/SubjectId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' } }
  /api/v1/admin/faculty:
    get:
      tags: [Admin]
      summary: Retrieve faculty
      x-required-role: ADMIN
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Admin]
      summary: Create faculty
      x-required-role: ADMIN
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' } }
  /api/v1/admin/faculty/{faculty_id}:
    get:
      tags: [Admin]
      summary: Retrieve faculty member
      x-required-role: ADMIN
      parameters: [{ $ref: '#/components/parameters/FacultyId' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    put:
      tags: [Admin]
      summary: Update faculty member
      x-required-role: ADMIN
      parameters: [{ $ref: '#/components/parameters/FacultyId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
