components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ExamId: { name: exam_id, in: path, required: true, schema: { type: integer, format: int64 } }
    AttemptId: { name: attempt_id, in: path, required: true, schema: { type: integer, format: int64 } }
    QuestionId: { name: question_id, in: path, required: true, schema: { type: integer, format: int64 } }
    SubjectId: { name: subject_id, in: path, required: true, schema: { type: integer, format: int64 } }
    FacultyId: { name: faculty_id, in: path, required: true, schema: { type: integer, format: int64 } }
    FacultySubjectId: { name: faculty_subject_id, in: path, required: true, schema: { type: integer, format: int64 } }
    UserId: { name: user_id, in: path, required: true, schema: { type: integer, format: int64 } }
    StudentId: { name: student_id, in: path, required: true, schema: { type: integer, format: int64 } }
    RegistrationId: { name: registration_id, in: path, required: true, schema: { type: integer, format: int64 } }
  schemas:
    RegisterRequest:
      type: object
      required: [first_name, last_name, email, password]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        phone: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    ExamRequest:
      type: object
      required: [subject_id, title, duration_minutes, total_marks, pass_marks]
      properties:
        subject_id: { type: integer }
        title: { type: string }
        duration_minutes: { type: integer }
        total_marks: { type: number }
        pass_marks: { type: number }
        adaptive_enabled: { type: boolean, default: false }
        initial_difficulty: { type: string, enum: [Easy, Medium, Hard], default: Medium }
    AnswerRequest:
      type: object
      additionalProperties: true
    ApiResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { nullable: true }
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
  responses:
    Success:
      description: Successful API response
      content:
        application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } }
    LoginSuccess:
      description: Successful login response containing a JWT
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ApiResponse' }
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token: { type: string }
                      token_type: { type: string, example: Bearer }
    Error:
      description: Error response
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }