  /api/v1/admin/registrations/{registration_id}:
    get:
      tags: [Admin]
      summary: Retrieve a registration
      x-required-role: ADMIN
      parameters: [{ $ref: '#/components/parameters/RegistrationId' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/attempts:
    get:
      tags: [Admin]
      summary: Retrieve attempts
      x-required-role: ADMIN
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/exams/{exam_id}/attempts:
    get:
      tags: [Admin]
      summary: Retrieve attempts for an exam
      x-required-role: ADMIN
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
